name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    # Optional: force JS actions to Node 24 during the transition window
    # env:
    #   FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'
          cache-dependency-path: yarn.lock

      - name: Remove global Yarn 1
        run: sudo rm -f /usr/local/bin/yarn /usr/local/bin/yarnpkg || true

      - name: Enable Corepack
        run: corepack enable

      - name: Ensure project Yarn is installed
        run: corepack install

      - name: Show versions
        run: |
          echo "which yarn:"
          which yarn || echo "no yarn on PATH"
          echo "node -v:"
          node -v
          echo "yarn -v:"
          yarn -v

      - name: Install dependencies
        run: yarn install --immutable || yarn install --immutable

      - name: Run TypeScript type check
        run: yarn tsc --noEmit

      - name: Run linter
        run: yarn lint

      - name: Run tests
        run: yarn test